<div th:fragment="fields" xmlns:th="http://www.thymeleaf.org">
    <h2 class="form-section-title">Dados do serviço</h2>
    <div class="mb-3">
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" id="nome" th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'">
        <div class="invalid-feedback" th:errors="*{nome}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="descricao">Descrição</label>
        <textarea class="form-control" id="descricao" rows="3" th:field="*{descricao}"></textarea>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label" for="duracaoMinutos">Duração (minutos)</label>
            <input class="form-control" id="duracaoMinutos" type="number" min="5" step="5" th:field="*{duracaoMinutos}" th:classappend="${#fields.hasErrors('duracaoMinutos')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{duracaoMinutos}"></div>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label" for="valor">Valor</label>
            <input class="form-control" id="valor" type="number" min="0.01" step="0.01" th:field="*{valor}" th:classappend="${#fields.hasErrors('valor')} ? ' is-invalid'">
            <div class="invalid-feedback" th:errors="*{valor}"></div>
        </div>
    </div>
</div>
