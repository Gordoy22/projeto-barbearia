<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{::scripts})}">
<head>
    <title>Agenda | BARBER</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <div>
            <h1>Agenda</h1>
            <p>Visualize os atendimentos por dia, semana ou mês.</p>
        </div>
        <a class="btn btn-dark" th:href="@{/agendamentos/novo}">Novo agendamento</a>
    </div>
    <div class="card-soft calendar-card">
        <div id="agendaCalendar"></div>
    </div>
</th:block>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/pt-br.global.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const calendar = new FullCalendar.Calendar(document.getElementById("agendaCalendar"), {
                locale: "pt-br",
                initialView: "timeGridWeek",
                height: "auto",
                slotMinTime: "08:00:00",
                slotMaxTime: "21:00:00",
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "timeGridDay,timeGridWeek,dayGridMonth"
                },
                buttonText: {
                    today: "Hoje",
                    day: "Hoje",
                    week: "Semana",
                    month: "Mês"
                },
                events: "/agendamentos/eventos",
                eventClick: (info) => {
                    info.jsEvent.preventDefault();
                    if (info.event.url) {
                        window.location.href = info.event.url;
                    }
                },
                eventDidMount: (info) => {
                    const props = info.event.extendedProps;
                    info.el.title = `${props.horario} · ${props.cliente} · ${props.servico} · ${props.profissional}`;
                }
            });
            calendar.render();
        });
    </script>
</th:block>
</body>
</html>
