<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR"
      th:fragment="layout (title, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">BARBER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</head>
<body>
<div class="app-shell" id="appShell">
    <aside class="app-sidebar d-none d-lg-flex" th:replace="~{layout/sidebar :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{layout/navbar :: navbar}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div th:replace="${content}"></div>
        </main>
        <footer th:replace="~{layout/footer :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/sidebar :: offcanvas}"></div>
<div th:replace="~{fragments/confirm-modal :: modal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/site.js}"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
