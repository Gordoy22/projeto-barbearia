<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{})}">
<head>
    <title>Dashboard | BARBER</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="|Olá, ${usuarioLogado != null ? usuarioLogado.nome : 'Administrador'}|">Olá, Administrador</h1>
            <p>Aqui está um resumo da sua barbearia.</p>
        </div>
        <a class="btn btn-dark" th:href="@{/agendamentos/novo}">
            <i class="bi bi-plus-lg"></i> Novo agendamento
        </a>
    </div>

    <div class="stat-grid">
        <div class="card-soft stat-card">
            <span>Agendamentos hoje</span>
            <strong th:text="${resumo.agendamentosHoje}">0</strong>
        </div>
        <div class="card-soft stat-card">
            <span>Clientes</span>
            <strong th:text="${resumo.clientes}">0</strong>
        </div>
        <div class="card-soft stat-card">
            <span>Funcionários</span>
            <strong th:text="${resumo.funcionarios}">0</strong>
        </div>
        <div class="card-soft stat-card">
            <span>Serviços</span>
            <strong th:text="${resumo.servicos}">0</strong>
        </div>
    </div>

    <div class="card-soft">
        <div class="p-4 pb-2 d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">Próximos agendamentos</h2>
            <a class="btn btn-ghost btn-sm" th:href="@{/agendamentos}">Ver todos</a>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>Horário</th>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Profissional</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${proximos.empty}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum agendamento próximo.</td>
                </tr>
                <tr th:each="item : ${proximos}">
                    <td th:text="${item.horaInicio}">09:00</td>
                    <td th:text="${item.clienteNome}">João Silva</td>
                    <td th:text="${item.servicoNome}">Corte</td>
                    <td th:text="${item.funcionarioNome}">Carlos</td>
                    <td>
                        <span class="badge-status" th:classappend="${'badge-' + #strings.toLowerCase(item.situacao)}"
                              th:text="${item.situacao.descricao}">Agendado</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
