<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | BARBER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-brand">
        <span class="mark"><i class="bi bi-scissors"></i></span>
        BARBER
    </div>
    <h1>Bem-vindo</h1>
    <p class="subtitle">Entre com seus dados para acessar o sistema.</p>

    <div th:if="${param.error}" class="login-alert">E-mail ou senha inválidos.</div>
    <div th:if="${param.logout}" class="login-alert" style="background:#ECFDF3;color:#067647;">Você saiu do sistema.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
            <label class="form-check-label" for="remember-me">Lembrar-me</label>
        </div>
        <button class="btn btn-dark w-100" type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
