# =============================================================================
# inventory.ini — Inventário Ansible funcional (usado de fato pelo playbook)
# -----------------------------------------------------------------------------
# O playbook roda via ansible_local: o Ansible é instalado e executado DENTRO
# da própria VM, provisionando a si mesma — por isso o único host é
# "localhost" com conexão local (sem SSH).
#
# Para a topologia "de verdade" (papel do host, portas, serviços, IP),
# ver ../inventory.yml — esse é o inventário documental/legível, pensado
# para quando o projeto evoluir para múltiplas VMs.
# =============================================================================
[app_servers]
localhost ansible_connection=local ansible_python_interpreter=auto_silent
