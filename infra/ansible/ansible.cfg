# =============================================================================
# ansible.cfg — Configuração do Ansible para o Projeto Barbearia
# -----------------------------------------------------------------------------
# Roda DENTRO da VM (ansible_local, disparado pelo Vagrantfile), então tudo
# aqui é relativo a /vagrant/ansible dentro do convidado.
# =============================================================================
# Observação: "inventory" e "roles_path" não são fixados aqui de propósito
# — caminhos relativos em ansible.cfg dependem do diretório de onde o
# ansible-playbook é chamado. O Vagrantfile já passa "-i ansible/inventory.ini"
# explicitamente, e o Ansible já procura roles/ automaticamente do lado do
# playbook (ansible/roles/), então nenhum dos dois precisa ser fixado aqui.
[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

# Necessário para "become_user: postgres" funcionar com ansible_connection=local:
# sem isso, o Ansible tenta ajustar permissão dos arquivos temporários usando
# sintaxe de ACL de BSD/macOS ("chmod A+..."), que não existe no Linux, e a
# task falha com "Failed to set permissions on the temporary files...". Essa é
# a correção oficialmente documentada para esse cenário — só torna os arquivos
# temporários da execução do Ansible legíveis por todo mundo (tranquilo numa
# VM de estudo de uso único). Ver:
# https://docs.ansible.com/ansible-core/2.17/playbook_guide/playbooks_privilege_escalation.html#risks-of-becoming-an-unprivileged-user
allow_world_readable_tmpfiles = True
