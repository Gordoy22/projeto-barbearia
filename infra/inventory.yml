# =============================================================================
# inventory.yml — Inventário da infraestrutura do Projeto Barbearia
# -----------------------------------------------------------------------------
# Documenta cada VM da infraestrutura, seu papel e como alcançá-la, em
# formato legível por humanos (all -> hosts -> <nome> -> vars, padrão de
# inventário do Ansible).
#
# Este arquivo é documental — não é lido por nenhuma ferramenta. O
# inventário FUNCIONAL, de fato usado pelo Ansible em tempo de execução, é
# ansible/inventory.ini (só "localhost", porque o Ansible roda dentro da
# própria VM via ansible_local — ver README.md, seção "Como o Ansible é
# usado"). Se o projeto evoluir para múltiplas VMs, este é o arquivo que
# vira o inventário Ansible de verdade.
# =============================================================================

all:
  hosts:
    barbearia-app:
      role: app-server              # roda o backend Spring Boot + PostgreSQL
      ip: 192.168.56.10             # IP fixo definido em config.yml / Vagrantfile
      ssh_user: vagrant
      ssh_access: "vagrant ssh"     # chave gerenciada automaticamente pelo Vagrant (insert_key)
      ssh_external: "ssh vagrant@192.168.56.10"  # funciona se você tiver uma chave pública em ~/.ssh (ver README)
      ports:
        - "8080/tcp"   # aplicação Spring Boot (Thymeleaf + REST), exposta na rede privada e via forwarded_port no host
        - "5432/tcp"   # PostgreSQL, acessível apenas dentro da rede privada 192.168.56.0/24
      services:
        - temurin-21-jdk
        - maven
        - postgresql-16
        - barbearia.service   # unit systemd que roda o .jar da aplicação
      provisioned_by: ansible/playbook.yml
      config_template: ansible/roles/configure_app/templates/application.properties.j2
